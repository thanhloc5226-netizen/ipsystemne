{% extends 'ipsystemapp/base.html' %}
{% load static %}

{% block title %}
  Tin tức | IPSystem
{% endblock %}

{% block extra_css %}
  <style>
    .project-card {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .project-card.hidden {
      display: none;
    }
    .project-card.fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
{% endblock %}

{% block content %}
<div class="container mx-auto py-10 px-6 md:px-20">
    <div class="row mb-2" style="display: flex !important; flex-wrap: nowrap !important;">
        <div class="col" style="width: 50% !important;">
             <span class="text-primary font-bold text-sm uppercase tracking-widest mb-2">{{ sample.title }}</span>
        </div>
        <div class="col" style="width: 50% !important; text-align: right;">
<a href="{% url 'samples:index' %}" 
   style="background:#dc3545;color:#fff;padding:6px 16px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:500;">
  ← Quay lại
</a>        </div>
         
    </div>
    <img src="{{ sample.file.url }}" alt="{{ sample.title }} file" class="h-auto rounded-lg shadow-lg mb-6">
</div>
{% endblock %}

{% block extra_js %}
  <script>
    const filterBtns = document.querySelectorAll('.filter-btn')
    const cards = document.querySelectorAll('.project-card')
    const loadMoreBtn = document.getElementById('load-more-btn')
    const loadMoreContainer = document.getElementById('load-more-container')
    let currentFilter = 'all'
    let batch2Loaded = false
    
    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterBtns.forEach((b) => {
          b.classList.remove('bg-primary', 'text-white')
          b.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300')
        })
        btn.classList.add('bg-primary', 'text-white')
        btn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300')
        currentFilter = btn.dataset.filter
        applyFilter()
      })
    })
    
    function applyFilter() {
      cards.forEach((card) => {
        const matchCat = currentFilter === 'all' || card.dataset.cat === currentFilter
        const isBatch2 = card.dataset.batch === '2'
        if (isBatch2 && !batch2Loaded) {
          card.classList.add('hidden')
          return
        }
        if (matchCat) {
          card.classList.remove('hidden')
          card.classList.add('fade-in')
          setTimeout(() => card.classList.remove('fade-in'), 400)
        } else {
          card.classList.add('hidden')
        }
      })
      loadMoreContainer.style.display = batch2Loaded ? 'none' : 'flex'
    }
    
    loadMoreBtn.addEventListener('click', () => {
      batch2Loaded = true
      applyFilter()
    })
    
    applyFilter()
  </script>
{% endblock %}
